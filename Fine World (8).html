{x:40*T,y:22*T,hat:'#a63',body:'#8cf',t:['Beat animals, earn money, buy better gear at the store.','The hospital will revive anyone who got knocked out.']},
{x:63*T,y:9*T,hat:'#555',body:'#9c9',t:['The cave is right behind me. The goat has been angry since Tuesday.','Without a Lantern and 3 Moon Shards you won\'t get in.']}];

for(let i=0;i<14;i++){const x=R(2,W-3),y=R(2,H-3),d=Math.hypot(x-13,y-9);if(d<10||map[y][x]===1||(x>59&&y<12)||(x>58&&y>44))continue;mk(ET[Math.max(0,Math.min(5,Math.floor(d/12))-R(0,1))],x,y)}
mk(['Bull Dog Chief',130,10,15,60,30,'#a64','growls like thunder.'],9,46,{boss:1,shard:'Moon Shard'});
mk(['Mad Monkey King',170,12,18,80,40,'#852','screeches and hurls coconuts.'],62,46,{boss:1,shard:'Moon Shard'});

npcs.forEach((o,i)=>o.k='o'+i);npcs.forEach(o=>{const x=Math.floor((o.x+8)/T),y=Math.floor((o.y+8)/T);if(solid(map[y][x]))map[y][x]=0});
let mode='title',SV=null,room=null,wait=0,TY='',su=null,NP=1,CV=null,SM=null,cur='field',cst=0,CF=1,Q=[],CR=0,HE=0,ip=0,WSCB=null,OPEERS=[],OL=null,KB2=0,LK='',FADE=0,SHK=0,FLT=[],CRY=0,dlg=null,en=null,ti=0,bm=0,bph='msg',tick=0,ended=0,lock=0,mn=null,num='';
// ===== DIALOGUE / MENUS =====
function say(lines,cb){dlg={lines,i:0,ch:0,cb}}
function wrap(s,w){const o=[];let l='';for(const a of s.split(' ')){if(g.measureText(l+a).width>w){o.push(l);l=''}l+=a+' '}o.push(l);return o}
function box(x,y,w,h){g.fillStyle='#000';g.fillRect(x-2,y-2,w+4,h+4);g.fillStyle='#fff';g.fillRect(x-1,y-1,w+2,h+2);g.fillStyle='#202040';g.fillRect(x,y,w,h)}
const cm=()=>{mn=null;mode='walk'};
function openMenu(t,o){mn={t,o,i:0};mode='menu'}
function buy(c,f,m){if(G.money<c){say(['Not enough money! You need $'+(c-G.money)+' more.']);return}if(c>=50){openMenu('Spend $'+c+'?',[['Yes, buy it',()=>{cm();pay(c,f,m)}],['No, not now',cm]]);return}pay(c,f,m)}

function door(t){if(t===16)openMenu('PURE HOTEL',[['Stay the night  $15',()=>buy(15,()=>{healAll();G.belly=0},'You sleep like a log. Fancy hotel!')],['Leave',cm]]);

 if(t===8)openMenu('PURE HOSPITAL',[['Full heal + revive  $10',()=>buy(10,healAll,'Doctor: Let me see... a bump here, a scrape there. Hold still! ...There, all fixed. Rest well!')],['Leave',cm]]);
 if(t===9)openMenu('PURE FOOD',[['Cookie  $3 (heals 25)',()=>buy(3,()=>G.cookie++,'Got a Cookie.')],['Burger  $8 (heals 60)',()=>buy(8,()=>G.burger++,'Got a Burger.')],['Potion  $30 (heals 80)',()=>buy(30,()=>G.pot++,'Got a Potion.')],['Leave',cm]]);
 if(t===10)openMenu('PURE STORE',[['Lantern  $30',()=>G.lens?say(['You already have one.']):buy(30,()=>G.lens=1,'Got the Lantern!')],['Bat upgrade  $'+(40+50*G.bat),()=>G.bat>=6?say(['No better bats in stock.']):buy(40+50*G.bat,()=>G.bat++,'Bat upgraded!')],['Armor  $'+(40+50*G.arm),()=>G.arm>=6?say(['No better armor in stock.']):buy(40+50*G.arm,()=>G.arm++,'Armor upgraded!')],['Steal something?',()=>{cm();say(['You stuff a candy bar in your jacket...','Officer Pickle: Hey! Stop right there, kid!'],()=>enter('jail'))}],['Leave',cm]])}
const hint=()=>!G.lens?'Buy a Lantern at the Pure Store, honey. It costs $30.':G.shards<3?'You have '+G.shards+'/3 Moon Shards. Beat the three beast chiefs!':'Head to the cave in the north-east. Watch out for the Angry Goat!';
const WRONG=['Hello? ...Wrong number, kiddo.','A parrot answers and repeats your number back.','"Pizza Planet, please hold." You hold forever.','You hear a goat bleating angrily, then a click.','Busy signal. beep beep beep beep.','Someone says "Fine." and hangs up.'];
function callNum(n){mode='walk';
 if(n==='6467174844'){momTalk()}else if(0){if(!G.mom){G.mom=1;G.money+=20;say(['Mom: Hi sweetie! Be careful out there.','Here, I wired you $20 for snacks. Don\'t ask how.'])}else say(['Mom: '+hint()])}

 if(bm===0){let d=R(10,16)+G.lv*2+m.atk+G.bat*4,cr=Math.random()<.12,ms=Math.random()<.07;if(ms)d=0;else if(cr)d*=2;en.hp-=d;if(d){sfx('hit');fl(d,1,cr)}say([ms?m.n+' swings and misses!':(cr?'SMAAAASH! ':'')+m.n+' bashes it for '+d+'!'],step)}

function settings(k){openMenu('SETTINGS',[['Music: '+(musicOn?'on':'off'),()=>{musicOn^=1;saveSet();settings(0)}],['Sound FX: '+(sfxOn?'on':'off'),()=>{sfxOn^=1;saveSet();settings(1)}],['Volume: '+Math.round(vol*100)+'%',()=>{vol=vol>=1?.2:Math.round((vol+.2)*10)/10;applySet();saveSet();settings(2)}],['Display: '+['fit','2x','3x'][scl],()=>{scl=(scl+1)%3;applySet();saveSet();settings(3)}],['Theme: '+theme,()=>{theme=theme==='dark'?'light':'dark';applySet();saveSet();settings(4)}],['Reset to defaults',()=>{musicOn=1;sfxOn=1;vol=.8;theme='dark';scl=0;applySet();saveSet();settings(5)}],['Back',inv]]);if(k)mn.i=k}
try{const s=JSON.parse(localStorage.getItem('fw_set'));if(s){musicOn=s.m?1:0;sfxOn=s.s?1:0;vol=+s.v||.8;theme=s.t==='light'?'light':'dark';scl=s.c|0}}catch(e){}applySet();

for(let y=21;y<=24;y++)for(let x=28;x<=34;x++)if(map[y][x]!==1&&!WALL[map[y][x]]&&!DR[map[y][x]])map[y][x]=40;
foes.forEach(f=>{const a=Math.floor((f.x+8)/T),b=Math.floor((f.y+8)/T);if(map[b]&&map[b][a]===40)f.y=19*T});
[[3,3,'money',60],[70,9,'pot',2],[3,52,'money',100],[68,52,'burger',3],[36,46,'pot',3]].forEach(([x,y,t,v],i)=>{map[y][x]=0;npcs.push({x:x*T,y:y*T,chest:1,k:'ch'+i,t:['chest'],act:()=>{if(G.ch[i]){say(['The chest is empty.']);return}G.ch[i]=1;chime();if(t==='money')G.money+=v;if(t==='pot')G.pot+=v;if(t==='burger')G.burger+=v;say(['You open a hidden chest!','Found '+(t==='money'?'$'+v:v+' '+(t==='pot'?'Health Potions':'Burgers'))+'!'])}})});
[[11,9,'HOME: Mom lives here. She gives you $50 every visit.'],[25,9,'PURE HOSPITAL: full heal and revive for $10.'],[35,9,'PURE FOOD: cookies, burgers and health potions.'],[43,9,'PURE STORE: Lantern, bat and armor upgrades.'],[54,19,'PURE HOTEL: rest for $15 and heal everyone.'],[7,28,'PURE OFFICE: Dad works here. Bounty board inside.']].forEach(([x,y,t],i)=>{map[y][x]=0;npcs.push({x:x*T,y:y*T,sign:1,k:'sg'+i,t:[t]})});
[{x:30,y:11,hat:'#c40',body:'#fa6',wd:1,k:'tb',t:['Baker: Burgers taste better when you are not in a battle.','Baker: I hid chests in the far corners of Pure. Do not tell anyone.']},{x:46,y:11,hat:'#2a8',body:'#eee',wd:1,k:'tj',t:['Jogger: I ran around Pure 400 times. The clock still says 3:07.']},{x:15,y:20,hat:'#80c',body:'#fc3',k:'ta',t:['Artist: I painted a goat. The goat painted me back. Weird day.','Artist: Phone numbers like 555-0123 or 555-0142 might be secret...']}].forEach(o=>{map[o.y][o.x]=0;o.x*=T;o.y*=T;npcs.push(o)});
function chime(){if(!AC||!sfxOn)return;const t=AC.currentTime+.02;[84,88,91,96,103].forEach((n,i)=>nt(n,t+i*.09,.6,'triangle',.13))}
let LT=0,ACC=0;function loop(t){t=t||0;if(!LT)LT=t;ACC+=Math.min(100,t-LT);LT=t;let n=0;while(ACC>=16.667&&n<5){update();for(const k in press)delete press[k];ACC-=16.667;n++}draw();requestAnimationFrame(loop)}
loop();
